<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide deck sample: Giving Feedback That Lands</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{--navy:#0A1628;--navy-soft:#14233D;--lime:#C8F135;--lime-soft:#E4F89A;--ink:#0A1628;--paper:#FAFAF7;--paper-warm:#F2F0E8;--rule:rgba(10,22,40,.12);--rule-strong:rgba(10,22,40,.22);--muted:rgba(10,22,40,.6);--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper-warm);overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar h1{font-family:'Sora';font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.chips span{font-family:'DM Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--white);border:1px solid var(--rule);border-radius:100px;padding:3px 9px}
.chips span.hi{background:var(--navy);color:var(--lime);border-color:var(--navy)}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;border-radius:100px;padding:8px 14px;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn.ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--rule-strong)}
.btn.ghost[aria-pressed="true"]{border-color:var(--navy);background:var(--lime-soft)}
.btn.pri{background:var(--navy);color:var(--lime);border:1.5px solid var(--navy)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(10,22,40,.14)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.rot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.slide{position:relative;width:min(calc(100vw - 112px), calc((100vh - 26px) * 16 / 9));aspect-ratio:16/9;background:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(10,22,40,.08),0 18px 40px rgba(10,22,40,.18)}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.notes{position:absolute;left:0;right:0;bottom:0;background:rgba(10,22,40,.94);color:var(--paper);padding:12px 16px 14px;font-size:13px;line-height:1.5;transform:translateY(102%);transition:transform .25s}
.notes b{display:block;font-family:'DM Mono';font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:4px}
.slide.show-notes .notes{transform:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--white);color:var(--navy);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,22,40,.14);transition:transform .2s}
.nav:hover:not(:disabled){transform:translateY(-50%) scale(1.06)}
.nav:disabled{opacity:.3;cursor:default}
.nav{top:calc(50% - 10px)} .nav.prev{left:-50px} .nav.next{right:-50px}
.nav svg{width:18px;height:18px}
.tilt{display:none;position:absolute;top:6px;left:0;right:0;justify-content:center;align-items:center;gap:6px;font-family:'DM Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);z-index:2}
.tilt svg{width:13px;height:13px}
.cnt{position:static;text-align:center;line-height:14px;font-family:'DM Mono';font-size:10px;letter-spacing:.1em;color:var(--muted)}
.strip{flex:none;display:flex;gap:8px;justify-content:center;padding:6px 14px 12px;overflow-x:auto}
.th{position:relative;flex:none;border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;opacity:.62;transition:opacity .2s,border-color .2s}
.th img{display:block;width:72px;height:40.5px;border-radius:4px;box-shadow:0 1px 3px rgba(10,22,40,.15)}
.th span{position:absolute;left:4px;bottom:3px;font-family:'DM Mono';font-size:8.5px;background:rgba(10,22,40,.75);color:var(--paper);border-radius:3px;padding:0 4px}
.th:hover{opacity:.9}
.th.on{opacity:1;border-color:var(--navy)}
.btn:focus-visible,.nav:focus-visible,.th:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (max-width:640px){
  .bar{flex-wrap:wrap} .chips{display:none} .acts{margin-left:0;width:100%} .acts .btn{flex:1;justify-content:center}
  .nav{width:32px;height:32px} .nav.prev{left:-40px} .nav.next{right:-40px}
  .slide{width:calc(100vw - 88px)}
}
/* phones held upright: show the slide sideways so it uses the full screen height */
@media (max-width:640px) and (orientation:portrait){
  .rot{transform:rotate(90deg)}
  .slide{width:min(calc(100vh - 34px - 88px), calc((100vw - 8px) * 16 / 9))}
  .tilt{display:flex}
  .notes{position:static;transform:none;display:none} .slide.show-notes .notes{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <p class="tilt" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9a9 9 0 0 1 3-5M21 15a9 9 0 0 1-3 5"/></svg>Turn your phone sideways</p>
    <div class="rot">
    <div class="slide" id="slide"><img id="img" alt=""><div class="notes" id="notes" aria-live="polite"><b>Facilitator notes</b><span id="noteTx"></span></div></div>
    <button class="nav prev" id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="nav next" id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <span class="cnt" id="cnt">1 / 9</span>
    </div>
  </div>
</div>

er names the report and the date (S), the unchecked figures (B), and the client call (I)."], TT=["Title", "Why feedback fails", "Three habits", "The SBI model", "Behavior, not character", "SBI in action", "SBI for praise", "Five steps", "Practice"];
