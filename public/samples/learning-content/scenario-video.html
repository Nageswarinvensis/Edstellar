<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The late report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--navy:#0A1628;--lime:#C8F135;--lime-soft:#E4F89A;--paper:#FAFAF7;--paper-warm:#F2F0E8;--cream:#EDE9DD;--white:#fff;
  --muted:rgba(10,22,40,.6);--rule:rgba(10,22,40,.12);--no:#B3261E}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;color:var(--navy);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'DM Mono';font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.player{position:relative;width:min(100%,calc((100vh - 50px) * 16 / 9));display:flex;flex-direction:column;gap:0}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px 12px 0 0;overflow:hidden;background:#E9E5D8;container-type:inline-size}
.frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* bubbles */
.bub{position:absolute;top:4.5%;max-width:40%;padding:1.3cqw 1.7cqw 1.4cqw;background:var(--white);border-radius:1.6cqw;box-shadow:0 .4cqw 1.6cqw rgba(10,22,40,.14);opacity:0;transform:translateY(.6cqw) scale(.97);transition:opacity .2s,transform .2s;pointer-events:none}
.bub.on{opacity:1;transform:none}
.bub::after{content:'';position:absolute;bottom:-1.2cqw;width:2.4cqw;height:2.4cqw;background:var(--white);transform:rotate(45deg);border-radius:.3cqw}
.bub.d{left:9%} .bub.d::after{left:58%}
.bub.n{right:9%} .bub.n::after{right:58%}
.bub .who{display:block;font-size:1.05cqw;color:var(--muted);margin-bottom:.4cqw}
.bub p{font-size:1.85cqw;line-height:1.38;font-weight:600;min-height:1.38em}
.chip{position:absolute;left:2.4%;top:4%;padding:.8cqw 1.3cqw;border-radius:100px;background:var(--navy);color:var(--lime);font-size:1.1cqw;opacity:0;transition:opacity .4s}
.chip.on{opacity:1}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;background:rgba(10,22,40,.72);color:var(--paper);opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;padding:4cqw}
.title.on{opacity:1}
.title small{font-size:1.3cqw;color:var(--lime)}
.title h2{font:800 4.6cqw/1.1 'Sora';letter-spacing:-.03em}
.title h2 em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:var(--lime);font-size:1.12em}
/* poster */
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;background:rgba(10,22,40,.55);color:var(--paper);border:0;width:100%;text-align:center}
.poster[hidden]{display:none}
.poster .pb{width:8cqw;height:8cqw;min-width:54px;min-height:54px;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25);transition:transform .2s}
.poster:hover .pb{transform:scale(1.06)}
.poster .pb svg{position:static;width:38%;height:38%}
.poster h2{font:800 3.4cqw/1.1 'Sora';letter-spacing:-.02em}
.poster p{font-size:1.5cqw;color:rgba(250,250,247,.8);max-width:52ch}
/* choices + feedback (overlay on desktop) */
.panel{position:absolute;inset:0 0 48px 0;border-radius:12px 12px 0 0;display:none;align-items:center;justify-content:center;padding:3cqw;background:rgba(10,22,40,.82)}
.panel.on{display:flex}
.card{width:min(560px,100%);background:var(--paper);border-radius:14px;padding:20px 22px 20px}
.card .ey{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}
.card h3{font:700 19px/1.25 'Sora';letter-spacing:-.02em;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:10px;border:1.5px solid var(--rule);background:var(--white);font-size:13.5px;line-height:1.4;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--navy);transform:translateY(-1px)}
.opt i{font:500 11px 'DM Mono';font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--lime)}
.opt.seen{opacity:.6}
.vchip{display:inline-flex;font:500 10px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:100px;margin-bottom:8px}
.vchip.best{background:var(--lime);color:var(--navy)} .vchip.part{background:var(--cream);color:var(--navy)} .vchip.weak{background:rgba(179,38,30,.1);color:var(--no)}
.card p.ex{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:16px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:100px;font:700 13px 'Sora';border:0;background:var(--navy);color:var(--lime)}
.btn.sec{background:transparent;color:var(--navy);border:1.5px solid rgba(10,22,40,.22)}
/* controls */
.ctl{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--navy);color:var(--paper);border-radius:0 0 12px 12px}
.ib{width:30px;height:30px;border-radius:50%;border:0;background:rgba(250,250,247,.1);display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(250,250,247,.2)}
.ib svg{width:13px;height:13px}
.track{flex:1;height:6px;border-radius:3px;background:rgba(250,250,247,.18);position:relative;cursor:pointer}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--lime)}
.track .cue{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--paper);opacity:.5}
.tm{font:500 11px 'DM Mono';color:rgba(250,250,247,.75);white-space:nowrap;min-width:78px;text-align:right}
.seg{font:500 10px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--lime);white-space:nowrap}
.cap{display:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
@media (max-width:640px){
  body{overflow:auto;display:block;padding:0}
  .player{width:100%}
  .frame{border-radius:10px 10px 0 0}
  .bub{display:none}
  .cap{display:block;min-height:64px;padding:10px 14px;background:var(--white);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
  .cap .who{display:block;font-size:9.5px;color:var(--muted);margin-bottom:3px}
  .cap p{font-size:14px;line-height:1.4;font-weight:600}
  .ctl{border-radius:0 0 10px 10px}
  .seg{display:none}
  .panel{position:static;background:none;padding:12px 0 0}
  .panel .card{border:1px solid var(--rule)}
  .poster h2{font-size:18px} .poster p{display:none}
  .title h2{font-size:22px} .title small{font-size:9px}
  .chip{font-size:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var MAIN={len:60,lines:[
 {w:'D',s:3.6,e:8.4,t:'Thanks for making time, Neha. I wanted to talk about the client report.'},
 {w:'N',s:9.0,e:12.4,t:'I know. It went out late again. I’m sorry.'},
 {w:'D',s:13.0,e:18.4,t:'That’s the third time this month. The client noticed, and so did my boss.',g:1},
 {w:'N',s:19.0,e:24.8,t:'I’m trying. But since the Apex launch started, I’m on two projects.',g:1},
 {w:'D',s:25.4,e:29.4,t:'Two projects? I thought Apex was only a few hours a week.'},
 {w:'N',s:30.0,e:36.8,t:'It was supposed to be. It’s closer to three days now. I catch up every evening.',g:1},
 {w:'D',s:37.4,e:40.4,t:'Why didn’t you tell me earlier?'},
 {w:'N',s:41.0,e:46.8,t:'You seemed so busy. I didn’t want to look like I couldn’t cope.'},
 {w:'D',s:47.6,e:49.8,t:'Okay… let me think about this.'}
],

function retime(S,ids,start,gap,tailFn){var pts=[[0,0]],t=start;
  S.lines.forEach(function(L,i){var os=L.s,oe=L.e;if(i>0)t+=(S.lines[i-1].w===L.w?.35:gap);L.id=ids[i];L.s=+t.toFixed(3);L.e=+(t+DUR[L.id]).toFixed(3);t=L.e;pts.push([os,L.s],[oe,L.e]);});
  var extra=tailFn(t);extra.forEach(function(p){pts.push(p);});var w=warpKeys(S.keys,pts);return w;}
(function(){
  var e9; var oldTitles=MAIN.titles.map(function(x){return x.slice();});
  var w=retime(MAIN,['D01','N01','D02','N02','D03','N03','D04','N04','D05'],3.4,.75,function(t){e9=t;return [[50.6,t+1.2],[55.4,t+5.2],[60,t+9.2]];});
  MAIN.titles[0][0]=+(e9+1.2).toFixed(2);MAIN.titles[0][1]=MAIN.titles[1][0]=+(e9+5.2).toFixed(2);MAIN.titles[1][1]=MAIN.len=+(e9+9.2).toFixed(2);
  [['A',['D_A','N_A']],['B',['D_B','N_B']],['C',['D_C','N_C']]].forEach(function(q){var S=END[q[0]],old=S.len;
    retime(S,q[1],.6,.8,function(t){S.len=+(t+1.4).toFixed(2);return [[old,S.len]];});});
})();
var AUD={};Object.keys(VO).forEach(function(k){var a=new Audio();a.preload='auto';a.src=VO[k];AUD[k]=a;});
var muted=false,curA=null;
function syncAudio(){var S=cur(),L=null;
  if(playing&&!muted)S.lines.forEach(function(x){if(T>=x.s&&T<x.e)L=x;});
  if(curA&&(!L||curA.id!==L.id+seg)){curA.a.pause();curA=null;}
  if(L){var off=T-L.s;
    if(!curA){var a=AUD[L.id];try{a.currentTime=Math.max(0,off);}catch(e){}a.play().catch(function(){});curA={id:L.id+seg,a:a,t0:performance.now()};}
    else if(performance.now()-curA.t0>600&&!curA.a.paused&&Math.abs(curA.a.currentTime-off)>.3){try{curA.a.currentTime=off;}catch(e){}}}
}
function mouthAt(L,t){var e=ENV[L.id];if(!e)return 0;var i=Math.floor((t-L.s)*50);if(i<0||i>=e.length)return 0;
  var v=(e.charCodeAt(i)-48)*.6+(i>0?e.charCodeAt(i-1)-48:0)*.4;return Math.min(1,v/8);}
/* ---------- engine ---------- */
var $=function(i){return document.getElementById(i);};
var seg='main',T=0,playing=false,last=0,seen={},done=false;
var C={D:{el:$('D'),ar:$('Dar'),dir:1,x:395,
   front:{sh:[103,-112],el:[520,612],a:186,len:74},back:{sh:[-103,-112],el:[270,612],a:-6,len:74}},
 N:{el:$('N'),ar:$('Nar'),dir:-1,x:885,
   front:{sh:[-96,-108],el:[772,612],a:-6,len:70},back:{sh:[96,-108],el:[998,612],a:186,len:70}}};
function setArm(node,S,E,ang,len,flip){var r=ang*Math.PI/180,H=[E[0]+Math.cos(r)*(len-12),E[1]+Math.sin(r)*(len-12)];var mx=(S[0]+E[0])/2+(E[0]>S[0]?10:-10),my=(S[1]+E[1])/2;
  var d='M'+S[0].toFixed(1)+','+S[1].toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+E[0].toFixed(1)+','+E[1].toFixed(1)+' L'+H[0].toFixed(1)+','+H[1].toFixed(1);
  node.querySelector('.ol').setAttribute('d',d);node.querySelector('.sl').setAttribute('d',d);
  node.querySelector('.hd').setAttribute('transform','translate('+H[0].toFixed(1)+','+H[1].toFixed(1)+') rotate('+ang.toFixed(1)+') scale(1.32,'+(flip?-1.32:1.32)+')');}
['D','N'].forEach(function(k){var c=C[k],g=c.el;c.head=g.querySelector('.head');c.torso=g.querySelector('.torso');c.mouth=g.querySelector('.mouth');
  c.bl=g.querySelector('.bl');c.br=g.querySelector('.brr');c.el_=g.querySelector('.el');c.er=g.querySelector('.er');c.fN=c.ar.querySelector('.front');c.bN=c.ar.querySelector('.back');
  c.hls=g.querySelectorAll('.hl');c.ebx=[+c.el_.getAttribute('cx'),+c.er.getAttribute('cx')];c.eby=+c.el_.getAttribute('cy');});
function cur(){return seg==='main'?MAIN:END[seg];}
function lerpKeys(ks,t){var a=ks[0],b=ks[ks.length-1];for(var i=0;i<ks.length-1;i++){if(t>=ks[i][0]&&t<=ks[i+1][0]){a=ks[i];b=ks[i+1];break;}}
  if(t>=b[0])return b.slice(1);var f=b[0]===a[0]?0:(t-a[0])/(b[0]-a[0]);f=f*f*(3-2*f);return a.slice(1).map(function(v,j){return v+(b[j+1]-v)*f;});}
function mouthPath(o,c){var w=20-o*4,u=c*7-o*5,l=c*7+o*20;return 'M'+(-w)+',0 Q0,'+u.toFixed(1)+' '+w+',0 Q0,'+l.toFixed(1)+' '+(-w)+',0Z';}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function draw(){
  var S=cur(),t=T;
  ['D','N'].forEach(function(k,ki){
    var c=C[k],p=lerpKeys(S.keys[k],t),ba=p[0],br=p[1],mc=p[2],ly=p[3],ht=p[4];
    var line=null;S.lines.forEach(function(L){if(L.w===k&&t>=L.s&&t<=L.e)line=L;});
    var talk=line?mouthAt(line,t):0;
    if(talk<.12)talk=0;
    c.mouth.setAttribute('d',mouthPath(talk,talk?mc*.4:mc));
    c.mouth.setAttribute('transform','translate(0,'+(k==='D'?-228:-226)+')');
    c.bl.setAttribute('transform','translate('+(k==='D'?-24:-22)+','+((k==='D'?-288:-284)-br)+') rotate('+(-ba)+')');
    c.br.setAttribute('transform','translate('+(k==='D'?24:22)+','+((k==='D'?-288:-284)-br)+') rotate('+(ba)+')');
    var ph=(t+ki*1.7)%4.3,blink=ph<.13?.1:1;
    var lx=c.dir*3.5*(ly<-2?0:1);
    [c.el_,c.er].forEach(function(e,j){e.setAttribute('ry',(9*blink).toFixed(2));e.setAttribute('cx',c.ebx[j]+lx);e.setAttribute('cy',c.eby+ly*.8);var h=c.hls[j];h.setAttribute('cx',c.ebx[j]+lx+2.5);h.setAttribute('cy',c.eby+ly*.8-3.5);h.setAttribute('r',blink<1?0:2);});
    var other=S.lines.some(function(L){return L.w!==k&&t>=L.s&&t<=L.e;});
    var rot=ht*c.dir*-1+(line?Math.sin(t*2.3+ki)*2.2:0)+(other?Math.sin(t*1.6)*1.2:Math.sin(t*.7+ki)*.6);
    var nod=other?Math.max(0,Math.sin(t*2.2+ki))*2.5:0;
    c.head.setAttribute('transform','translate(0,'+(Math.abs(ht)*.6+nod).toFixed(2)+') rotate('+rot.toFixed(2)+' 0 -200)');
    var br_=Math.sin(t*1.8+ki)*1.5;c.torso.setAttribute('transform','translate(0,'+br_.toFixed(2)+')');
    // gesture
    var g=0;if(line&&line.g){g=ease((t-line.s)/.6)*ease((line.e-t)/.6);}
    var wob=g?Math.sin(t*4.2)*6*g:0;
    var sy=580+br_;
    [['front',c.fN,1],['back',c.bN,0]].forEach(function(q){var A=c[q[0]],gg=q[2]?g:0;
      var fid=(!q[2]&&seg==='main'&&k==='N'&&t<9)?Math.sin(t*5)*4:0;
      var S=[c.x+A.sh[0],sy+A.sh[1]],E=[A.el[0],A.el[1]-gg*16];
      var ang=A.a+(q[2]?(gg*52+wob):0)*(A.a>90?1:-1)+fid;
      setArm(q[1],S,E,ang,A.len,A.a>90);});
    // bubble
    var b=$(k==='D'?'bD':'bN');
    var bl=null;S.lines.forEach(function(L){if(L.w===k&&t>=L.s-.1&&t<=L.e+.5)bl=L;});
    if(bl){var n=Math.ceil(bl.t.length*Math.min(1,Math.max(0,t-bl.s)/((bl.e-bl.s)*.8)));b.querySelector('p').textContent=bl.t.slice(0,n)||' ';b.classList.add('on');}else b.classList.remove('on');
  });
  // caption strip (mobile)
  var any=null;S.lines.forEach(function(L){if(T>=L.s-.1&&T<=L.e+.5)any=L;});
  if(any){$('capW').textContent=any.w==='D'?'David · Team lead':'Neha · Analyst';$('capT').textContent=any.t;}
  else if(seg==='main'&&T>50.4){$('capW').textContent=' ';$('capT').textContent=T<55.4?'David has a choice to make.':'What would you do?';}
  else{$('capW').innerHTML='&nbsp;';$('capT').innerHTML='&nbsp;';}
  // clock
  var mins=(seg==='main'?T:60+T)/60*6;$('mHand').setAttribute('transform','rotate('+(mins*6)+')');$('hHand').setAttribute('transform','rotate('+(300+mins*.5)+')');
  $('chip').classList.toggle('on',seg==='main'&&T<3.4);
  var tt=null;if(seg==='main')MAIN.titles.forEach(function(x){if(T>=x[0]&&T<x[1])tt=x;});
  if(tt){$('ttlS').textContent=tt[2];$('ttlH').innerHTML=tt[3];$('ttl').classList.add('on');}else $('ttl').classList.remove('on');
  // controls
  var L=S.len;$('fill').style.width=(T/L*100)+'%';
  $('tm').textContent=fmt(T)+' / '+fmt(L);
  $('seg').textContent=seg==='main'?'Scene':'Ending '+seg;
}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function setPlay(p){playing=p;$('ppI').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/>':'<path d="M7 4.5v15l13-7.5z" fill="currentColor"/>';$('pp').setAttribute('aria-label',p?'Pause':'Play');last=performance.now();}
function loop(now){
  if(playing){T+=(now-last)/1000;last=now;var L=cur().len;if(T>=L){T=L;setPlay(false);finish();}}
  syncAudio();draw();requestAnimationFrame(loop);
}
function finish(){if(seg==='main')showChoices();else showFeedback(seg);}
function showChoices(){
  var html='<span class="ey mono">Your turn</span><h3>What should David say next?</h3><div class="opts">'+['A','B','C'].map(function(k){return '<button class="opt'+(seen[k]?' seen':'')+'" data-k="'+k+'" type="button"><i>'+k+'</i><span>'+END[k].o+'</span></button>';}).join('')+'</div>';
  $('card').innerHTML=html;$('panel').classList.add('on');
  [].forEach.call($('card').querySelectorAll('.opt'),function(b){b.onclick=function(){playEnding(b.dataset.k);};});
  var f=$('card').querySelector('.opt');if(f)f.focus({preventScroll:innerWidth>640});
  if(innerWidth<=640)$('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function playEnding(k){seen[k]=1;seg=k;T=0;$('panel').classList.remove('on');setPlay(true);if(innerWidth<=640)window.scrollTo({top:0,behavior:'smooth'});}
function showFeedback(k){
  var e=END[k];
  $('card').innerHTML='<span class="vchip '+e.v+'">'+e.vt+'</span><h3>'+e.h+'</h3><p class="ex">'+e.x+'</p><div class="brow"><button class="btn" id="tryo" type="button">Try another answer</button><button class="btn sec" id="again" type="button">Watch from the start</button></div>';
  $('panel').classList.add('on');
  $('tryo').onclick=function(){seg='main';T=MAIN.len;showChoices();};
  $('again').onclick=restart;
  $('tryo').focus({preventScroll:innerWidth>640});
  if(innerWidth<=640)$('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function restart(){seg='main';T=0;$('panel').classList.remove('on');$('poster').hidden=true;setPlay(true);}
$('poster').onclick=function(){$('poster').hidden=true;setPlay(true);};
$('pp').onclick=function(){
  if($('poster').hidden===false){$('poster').hidden=true;return setPlay(true);}
  if(!playing&&T>=cur().len){return;}
  setPlay(!playing);};
$('rs').onclick=restart;
$('mu').onclick=function(){muted=!muted;this.setAttribute('aria-pressed',muted);this.setAttribute('aria-label',muted?'Unmute':'Mute');$('muW').style.display=muted?'none':'';$('muX').style.display=muted?'':'none';};
$('track').onclick=function(ev){if($('panel').classList.contains('on'))$('panel').classList.remove('on');var r=this.getBoundingClientRect();T=Math.max(0,Math.min(.999,(ev.clientX-r.left)/r.width))*cur().len;$('poster').hidden=true;};
document.addEventListener('keydown',function(e){if(e.key===' '&&e.target===document.body){e.preventDefault();$('pp').click();}});
draw();requestAnimationFrame(loop);
</script>
