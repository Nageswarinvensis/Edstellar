<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 560 485" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
<style><![CDATA[
/* Self-contained: colours are hardcoded so this SVG works standalone
   (loaded via object-embed or img) without inheriting page CSS variables. */
:root {
  --navy:  #0a1628;
  --lime:  #c8f135;
  --olive: #566e0b;
  --error: #b3261e;
  --paper: #fafaf7;
}

/* typography – Google Fonts not available standalone; system fallbacks used */
.ehr-lab  { font-family: "DM Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .06em; fill: rgba(10,22,40,.6); }
.ehr-top  { fill: #566e0b; }
.ehr-ann-h { font-family: "DM Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; fill: #566e0b; }
.ehr-a circle  { fill: #fff; stroke: #0a1628; stroke-width: 1.4; }
.ehr-a text    { font-family: "DM Mono", ui-monospace, monospace; font-size: 10px; font-weight: 500; fill: #0a1628; }
.ehr-a .ehr-a-t { font-family: "DM Sans", system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #0a1628; }
.ehr-a { opacity: .45; animation: ehr-ann 12s ease-in-out var(--d, 0s) infinite; }
@keyframes ehr-ann { 0%, 30% { opacity: 1; } 36%, 100% { opacity: .45; } }
.ehr-a .ehr-mk circle { fill: #c8f135; stroke: #0a1628; }

/* sources */
.ehr-src ellipse,
.ehr-src path { fill: #fff; stroke: #0a1628; stroke-width: 1.4; }

/* lanes */
.ehr-lane0 { stroke: rgba(10,22,40,.22); stroke-width: 2; stroke-linecap: round; }
.ehr-lane1 { stroke: url(#ehrLane); stroke-width: 2.4; stroke-linecap: round; }
.ehr-flow  {
  stroke: #fafaf7; stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 1.5 22;
  animation: ehr-flow 1.8s linear infinite;
}
@keyframes ehr-flow { to { stroke-dashoffset: -23.5; } }

/* gate */
.ehr-gate { fill: rgba(200,241,53,.22); stroke: #0a1628; stroke-width: 1.6; }
.ehr-scan {
  stroke: #566e0b; stroke-width: 2.4; stroke-linecap: round;
  animation: ehr-scan 2.6s ease-in-out infinite alternate;
}
@keyframes ehr-scan { from { transform: translateY(0); } to { transform: translateY(188px); } }
.ehr-drop { stroke: rgba(179,38,30,.6); stroke-width: 1.4; stroke-dasharray: 3 4; }

/* team */
.ehr-team circle,
.ehr-team path { fill: none; stroke: #0a1628; stroke-width: 1.6; stroke-linecap: round; }
.ehr-lens { animation: ehr-lens 2.6s ease-in-out infinite alternate; }
.ehr-lens circle,
.ehr-lens path  { stroke: #566e0b; stroke-width: 2; }
@keyframes ehr-lens {
  from { transform: translate(270px, 172px); }
  to   { transform: translate(266px, 180px); }
}

/* catch tray */
.ehr-tray rect { fill: rgba(179,38,30,.10); stroke: #b3261e; stroke-width: 1.5; }
.ehr-tray text { font-family: "DM Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .08em; fill: #b3261e; }

/* dashboard */
.ehr-dash-b { fill: #fff; stroke: #0a1628; stroke-width: 1.5; }
.ehr-bar {
  fill: #c8f135; stroke: #0a1628; stroke-width: 1.2;
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: ehr-bar 4s ease-in-out calc(var(--i, 0) * .3s) infinite alternate;
}
@keyframes ehr-bar { from { transform: scaleY(.82); } to { transform: scaleY(1); } }
.ehr-spark { fill: none; stroke: #566e0b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ehr-trust rect { fill: #c8f135; stroke: #0a1628; stroke-width: 1.4; }
.ehr-trust path { fill: none; stroke: #0a1628; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ehr-trust text { font-family: "DM Mono", ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .06em; fill: #0a1628; }

/* data rows */
.ehr-row          { offset-anchor: 0 0; offset-rotate: 0deg; transform-origin: 0 0; }
.ehr-row rect     { stroke: #0a1628; stroke-width: 1.2; }
.ehr-row path     { stroke: #0a1628; stroke-width: 1.3; stroke-linecap: round; }
.ehr-bad path     { stroke: #fafaf7; }
.ehr-good         { animation: ehr-move 9s linear var(--d, 0s) infinite; }
.ehr-good rect    { animation: ehr-good-color 9s linear var(--d, 0s) infinite; }
@keyframes ehr-move {
  0%   { offset-distance: 0%;   opacity: 0; }
  6%   { opacity: 1; }
  94%  { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes ehr-good-color {
  0%, 41.9%   { fill: #fff; }
  43.9%, 100% { fill: #c8f135; }
}
.ehr-bad0      { animation: ehr-badm0 9s linear var(--d, 0s) infinite; }
.ehr-bad0 rect { animation: ehr-badc0 9s linear var(--d, 0s) infinite; }
@keyframes ehr-badm0 {
  0%    { offset-distance: 0%;    opacity: 0; }
  6%    { opacity: 1; }
  40%   { offset-distance: 40%; }
  46%   { offset-distance: 40%; }
  86%   { offset-distance: 100%; opacity: 1; }
  100%  { offset-distance: 100%; opacity: 0; }
}
@keyframes ehr-badc0 {
  0%, 39%   { fill: #fff; }
  41%, 100% { fill: #b3261e; }
}
.ehr-bad2      { animation: ehr-badm2 9s linear var(--d, 0s) infinite; }
.ehr-bad2 rect { animation: ehr-badc2 9s linear var(--d, 0s) infinite; }
@keyframes ehr-badm2 {
  0%     { offset-distance: 0%;     opacity: 0; }
  6%     { opacity: 1; }
  66.7%  { offset-distance: 66.7%; }
  72.7%  { offset-distance: 66.7%; }
  86%    { offset-distance: 100%;  opacity: 1; }
  100%   { offset-distance: 100%;  opacity: 0; }
}
@keyframes ehr-badc2 {
  0%, 65.7%   { fill: #fff; }
  67.7%, 100% { fill: #b3261e; }
}

/* legend */
.ehr-key text     { font-family: "DM Mono", ui-monospace, monospace; font-size: 9.5px; letter-spacing: .06em; fill: rgba(10,22,40,.6); }
.ehr-key rect     { stroke: #0a1628; stroke-width: 1; }
.ehr-key .k0      { fill: #fff; }
.ehr-key .k1      { fill: #c8f135; }
.ehr-key .k2      { fill: #b3261e; }
.ehr-key .ehr-cap { text-transform: uppercase; letter-spacing: .12em; fill: rgba(10,22,40,.45); }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .ehr-a { opacity: 1; }
  .ehr-good { offset-distance: var(--p, 0%); }
  .ehr-good rect { fill: #fff; }
}
]]></style>

<defs>
  <linearGradient id="ehrLane" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="408" y2="0">
    <stop offset="0" stop-color="#566E0B" stop-opacity=".45"/>
    <stop offset="1" stop-color="#566E0B" stop-opacity="1"/>
  </linearGradient>
</defs>

<!-- Source cylinders -->
<g class="ehr-src" transform="translate(52 262)"><path d="M-22 -12 v24 a22 7 0 0 0 44 0 v-24"/><ellipse cx="0" cy="-12" rx="22" ry="7"/></g>
<g class="ehr-src" transform="translate(52 334)"><path d="M-22 -12 v24 a22 7 0 0 0 44 0 v-24"/><ellipse cx="0" cy="-12" rx="22" ry="7"/></g>
<g class="ehr-src" transform="translate(52 406)"><path d="M-22 -12 v24 a22 7 0 0 0 44 0 v-24"/><ellipse cx="0" cy="-12" rx="22" ry="7"/></g>
<text class="ehr-lab" x="30" y="236">Sources</text>

<!-- Pipeline lanes -->
<line class="ehr-lane0" x1="92" y1="262" x2="236" y2="262"/>
<line class="ehr-lane1" x1="236" y1="262" x2="408" y2="262"/>
<line class="ehr-flow"  x1="236" y1="262" x2="408" y2="262"/>
<line class="ehr-lane0" x1="92" y1="334" x2="236" y2="334"/>
<line class="ehr-lane1" x1="236" y1="334" x2="408" y2="334"/>
<line class="ehr-flow"  x1="236" y1="334" x2="408" y2="334"/>
<line class="ehr-lane0" x1="92" y1="406" x2="236" y2="406"/>
<line class="ehr-lane1" x1="236" y1="406" x2="408" y2="406"/>
<line class="ehr-flow"  x1="236" y1="406" x2="408" y2="406"/>

<!-- Gate -->
<rect class="ehr-gate" x="220" y="230" width="32" height="208" rx="16"/>
<line class="ehr-scan" x1="220" x2="252" y1="240" y2="240"/>
<line class="ehr-drop" x1="236" y1="438" x2="236" y2="464"/>

<!-- Team -->
<g class="ehr-team">
  <g transform="translate(222 196)"><circle cx="0" cy="-5" r="5"/><path d="M-9 9c1-5 4.5-7.5 9-7.5s8 2.5 9 7.5"/></g>
  <g transform="translate(250 196)"><circle cx="0" cy="-5" r="5"/><path d="M-9 9c1-5 4.5-7.5 9-7.5s8 2.5 9 7.5"/></g>
  <g class="ehr-lens" transform="translate(270 172)"><circle r="9"/><path d="M6.5 6.5 L13 13"/></g>
</g>
<text class="ehr-lab ehr-top" x="236" y="150" text-anchor="middle">Team spot check</text>

<!-- Catch tray -->
<g class="ehr-tray">
  <rect x="212" y="464" width="104" height="30" rx="8"/>
  <text x="280" y="483" text-anchor="middle">Caught</text>
</g>

<!-- Dashboard -->
<g class="ehr-dash">
  <rect class="ehr-dash-b" x="430" y="206" width="112" height="232" rx="12"/>
  <text class="ehr-lab" x="442" y="228">Dashboard</text>
  <rect class="ehr-bar" style="--i:0" x="446" y="352" width="14" height="52" rx="3"/>
  <rect class="ehr-bar" style="--i:1" x="468" y="326" width="14" height="78" rx="3"/>
  <rect class="ehr-bar" style="--i:2" x="490" y="340" width="14" height="64" rx="3"/>
  <rect class="ehr-bar" style="--i:3" x="512" y="308" width="14" height="96" rx="3"/>
  <path class="ehr-spark" d="M444 290 L466 276 L488 282 L510 262 L528 254"/>
  <g class="ehr-trust" transform="translate(486 186)">
    <rect x="-40" y="-13" width="80" height="26" rx="13"/>
    <path d="M-30 0 L-25.5 4.5 L-18.5 -3.5"/>
    <text x="9" y="4" text-anchor="middle">Trusted</text>
  </g>
</g>

<!-- Good rows — lane 1 -->
<g class="ehr-row ehr-good" style="offset-path:path('M92 262 L428 262');--d:-0.0s;--p:18%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 262 L428 262');--d:-3.0s;--p:62%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 262 L428 262');--d:-6.0s;--p:92%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<!-- Good rows — lane 2 -->
<g class="ehr-row ehr-good" style="offset-path:path('M92 334 L428 334');--d:-1.1s;--p:18%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 334 L428 334');--d:-4.1s;--p:62%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 334 L428 334');--d:-7.1s;--p:92%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<!-- Good rows — lane 3 -->
<g class="ehr-row ehr-good" style="offset-path:path('M92 406 L428 406');--d:-2.2s;--p:18%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 406 L428 406');--d:-5.2s;--p:62%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-good" style="offset-path:path('M92 406 L428 406');--d:-8.2s;--p:92%"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<!-- Bad rows -->
<g class="ehr-row ehr-bad ehr-bad0" style="offset-path:path('M92 262 L236 262 L236 478');--d:-1.0s"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>
<g class="ehr-row ehr-bad ehr-bad2" style="offset-path:path('M92 406 L236 406 L236 478');--d:-5.5s"><rect x="-9" y="-6" width="18" height="12" rx="3"/><path d="M-5 -1.5 h10 M-5 1.5 h7"/></g>

<!-- Annotation strip -->
<g class="ehr-ann">
  <text class="ehr-ann-h" x="24" y="38">In the labs, your team learns to</text>
  <g class="ehr-a" style="--d:0s">
    <g transform="translate(34 62)"><circle r="9"/><text y="3.5" text-anchor="middle">1</text></g>
    <text class="ehr-a-t" x="52" y="65.5">Spot-check every load at the gate</text>
    <g class="ehr-mk" transform="translate(258 214)"><circle r="9"/><text y="3.5" text-anchor="middle">1</text></g>
  </g>
  <g class="ehr-a" style="--d:4s">
    <g transform="translate(34 87)"><circle r="9"/><text y="3.5" text-anchor="middle">2</text></g>
    <text class="ehr-a-t" x="52" y="90.5">Catch and hold the bad rows</text>
    <g class="ehr-mk" transform="translate(330 478)"><circle r="9"/><text y="3.5" text-anchor="middle">2</text></g>
  </g>
  <g class="ehr-a" style="--d:8s">
    <g transform="translate(34 112)"><circle r="9"/><text y="3.5" text-anchor="middle">3</text></g>
    <text class="ehr-a-t" x="52" y="115.5">Send only trusted data to dashboards</text>
    <g class="ehr-mk" transform="translate(432 186)"><circle r="9"/><text y="3.5" text-anchor="middle">3</text></g>
  </g>
</g>

<!-- Legend -->
<g class="ehr-key" transform="translate(24 506)">
  <rect class="k0" x="0" y="-8" width="14" height="9" rx="2"/>
  <text x="20" y="0">Not yet checked</text>
  <rect class="k1" x="128" y="-8" width="14" height="9" rx="2"/>
  <text x="148" y="0">Good data</text>
  <rect class="k2" x="230" y="-8" width="14" height="9" rx="2"/>
  <text x="250" y="0">Bad data</text>
  <text class="ehr-cap" x="508" y="0" text-anchor="end">Illustrative sample</text>
</g>
</svg>
